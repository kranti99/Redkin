
<form id="deletion-form" action="mailto:mindwasher99@gmail.com" method="GET" enctype="text/plain">
    <div class="form-group">
        <label for="email">Account Email Address</label>
        <input
            type="email"
            id="email"
            name="account_email"
            placeholder="The email linked to your Redkin account"
            required
        >
    </div>

    <div class="form-group">
        <label for="reason">Reason for deletion (Optional)</label>
        <textarea
            id="reason"
            name="reason"
            rows="4"
            placeholder="Tell us why you are leaving..."
        ></textarea>
    </div>

    <button type="submit" class="submit-btn">
        Send Deletion Request
    </button>
</form>

<script>
document.getElementById('deletion-form').addEventListener('submit', function (event) {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const reason = document.getElementById('reason').value.trim();

    const subject = 'Redkin Data Deletion Request';

    const body = [
        'Redkin Data Deletion Request',
        '',
        'Account Email Address: ' + email,
        '',
        'Reason for deletion: ' + (reason || 'Not provided'),
        '',
        'Please delete my Redkin account and associated data.'
    ].join('\n');

    const mailtoURL =
        'mailto:mindwasher99@gmail.com' +
        '?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);

    window.location.href = mailtoURL;
});
</script>
